<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0A14">
<title>ОЦЕНКИ · Вытяни четверть</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg: #0A0A14;
    --bg-2: #0F0F1C;
    --card: #15151F;
    --card-border: #2A2A3F;
    --card-hover: #1C1C2A;
    --neon-cyan: #00F5FF;
    --neon-pink: #FF00EA;
    --neon-purple: #B026FF;
    --neon-green: #00FF88;
    --neon-yellow: #FFE600;
    --neon-red: #FF3860;
    --text: #E8E8FF;
    --text-dim: #7A7A99;
    --text-mute: #4A4A66;
    --radius: 20px;
    --radius-sm: 12px;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }
  
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  
  body {
    background:
      radial-gradient(ellipse at 20% 0%, rgba(176, 38, 255, 0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(0, 245, 255, 0.1) 0%, transparent 50%),
      var(--bg);
  }
  
  .app {
    max-width: 420px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 16px) 16px;
    position: relative;
    overflow: hidden;
  }
  
  /* ===== HEADER ===== */
  .app-header {
    padding: 8px 4px 20px;
    flex-shrink: 0;
  }
  
  .app-title {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-purple) 50%, var(--neon-pink) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(176, 38, 255, 0.4));
    margin-bottom: 4px;
  }
  
  .app-subtitle {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  
  /* ===== SUBJECTS LIST ===== */
  .subjects-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 4px 2px 80px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .subjects-list::-webkit-scrollbar { display: none; }
  
  .subject-card {
    background: linear-gradient(145deg, var(--card) 0%, var(--bg-2) 100%);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s;
    animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    cursor: pointer;
  }
  
  .subject-card:active { transform: scale(0.98); }
  
  .subject-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
    opacity: 0.6;
  }
  
  .subject-card[data-target="5"]::before {
    background: linear-gradient(90deg, transparent, var(--neon-pink), var(--neon-purple), transparent);
  }
  
  .subject-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  
  .subject-name {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    flex: 1;
    margin-right: 8px;
  }
  
  .subject-target {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(0, 245, 255, 0.1);
    color: var(--neon-cyan);
    border: 1px solid rgba(0, 245, 255, 0.3);
    letter-spacing: 0.5px;
  }
  
  .subject-card[data-target="5"] .subject-target {
    background: rgba(255, 0, 234, 0.1);
    color: var(--neon-pink);
    border-color: rgba(255, 0, 234, 0.3);
  }
  
  .subject-stats {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  
  .stat {
    display: flex;
    flex-direction: column;
  }
  
  .stat-label {
    font-size: 10px;
    color: var(--text-mute);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  
  .stat-value {
    font-size: 20px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  
  .stat-value.avg { color: var(--neon-cyan); }
  .stat-value.needed { color: var(--neon-yellow); }
  .stat-value.done { color: var(--neon-green); }
  .stat-value.panic { color: var(--neon-red); }
  
  .progress-bar {
    margin-top: 12px;
    height: 4px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 0 10px var(--neon-cyan);
  }
  
  .progress-fill.panic {
    background: linear-gradient(90deg, var(--neon-red), var(--neon-pink));
    box-shadow: 0 0 10px var(--neon-red);
    animation: panicPulse 1.5s ease-in-out infinite;
  }
  
  .progress-fill.done {
    background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
    box-shadow: 0 0 10px var(--neon-green);
  }
  
  /* ===== EMPTY STATE ===== */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }
  
  .empty-icon {
    font-size: 64px;
    margin-bottom: 16px;
    filter: drop-shadow(0 0 20px rgba(176, 38, 255, 0.5));
    animation: float 3s ease-in-out infinite;
  }
  
  .empty-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text);
  }
  
  .empty-text {
    font-size: 14px;
    color: var(--text-dim);
    max-width: 260px;
  }
  
  /* ===== FAB ===== */
  .fab {
    position: absolute;
    bottom: calc(var(--safe-bottom) + 24px);
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
    color: var(--bg);
    font-size: 28px;
    font-weight: 300;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0, 245, 255, 0.4), 0 0 40px rgba(176, 38, 255, 0.3);
    transition: transform 0.2s;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .fab:active { transform: scale(0.9); }
  
  /* ===== MODAL ===== */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(5, 5, 12, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  
  .modal.active {
    opacity: 1;
    pointer-events: auto;
  }
  
  .modal-content {
    width: 100%;
    max-width: 420px;
    max-height: 92vh;
    max-height: 92dvh;
    background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
    border-radius: 28px 28px 0 0;
    border-top: 1px solid var(--card-border);
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    padding: 8px 20px calc(var(--safe-bottom) + 20px);
    scrollbar-width: none;
  }
  .modal-content::-webkit-scrollbar { display: none; }
  
  .modal.active .modal-content { transform: translateY(0); }
  
  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--text-mute);
    border-radius: 2px;
    margin: 8px auto 16px;
  }
  
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  
  .modal-title {
    font-size: 22px;
    font-weight: 800;
  }
  
  .modal-close {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  /* ===== FORM ===== */
  .form-group {
    margin-bottom: 20px;
  }
  
  .form-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  
  .form-input {
    width: 100%;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 16px;
    font-weight: 500;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }
  
  .form-input:focus {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 0 3px rgba(0, 245, 255, 0.15);
  }
  
  /* ===== GRADE BUTTONS ===== */
  .grade-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  
  .grade-btn {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
    font-size: 24px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  
  .grade-btn:active { transform: scale(0.92); }
  
  .grade-btn[data-grade="2"] { color: var(--neon-red); }
  .grade-btn[data-grade="3"] { color: var(--neon-yellow); }
  .grade-btn[data-grade="4"] { color: var(--neon-cyan); }
  .grade-btn[data-grade="5"] { color: var(--neon-green); }
  
  .grade-btn[data-grade="2"]:active { background: rgba(255, 56, 96, 0.15); box-shadow: 0 0 20px rgba(255, 56, 96, 0.4); }
  .grade-btn[data-grade="3"]:active { background: rgba(255, 230, 0, 0.15); box-shadow: 0 0 20px rgba(255, 230, 0, 0.4); }
  .grade-btn[data-grade="4"]:active { background: rgba(0, 245, 255, 0.15); box-shadow: 0 0 20px rgba(0, 245, 255, 0.4); }
  .grade-btn[data-grade="5"]:active { background: rgba(0, 255, 136, 0.15); box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
  
  .grades-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 36px;
    padding: 10px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
  }
  
  .grade-chip {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 15px;
    position: relative;
    animation: chipIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer;
  }
  
  .grade-chip[data-grade="2"] { background: rgba(255, 56, 96, 0.2); color: var(--neon-red); border: 1px solid rgba(255, 56, 96, 0.4); }
  .grade-chip[data-grade="3"] { background: rgba(255, 230, 0, 0.15); color: var(--neon-yellow); border: 1px solid rgba(255, 230, 0, 0.3); }
  .grade-chip[data-grade="4"] { background: rgba(0, 245, 255, 0.15); color: var(--neon-cyan); border: 1px solid rgba(0, 245, 255, 0.3); }
  .grade-chip[data-grade="5"] { background: rgba(0, 255, 136, 0.15); color: var(--neon-green); border: 1px solid rgba(0, 255, 136, 0.3); }
  
  .grades-empty {
    color: var(--text-mute);
    font-size: 13px;
    padding: 4px;
    font-style: italic;
  }
  
  /* ===== TARGET SELECTOR ===== */
  .target-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  
  .target-btn {
    padding: 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text-dim);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  
  .target-btn.active[data-target="4"] {
    background: rgba(0, 245, 255, 0.1);
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
    box-shadow: 0 0 20px rgba(0, 245, 255, 0.2);
  }
  
  .target-btn.active[data-target="5"] {
    background: rgba(255, 0, 234, 0.1);
    border-color: var(--neon-pink);
    color: var(--neon-pink);
    box-shadow: 0 0 20px rgba(255, 0, 234, 0.2);
  }
  
  /* ===== RESULT ===== */
  .result-box {
    background: linear-gradient(145deg, var(--card) 0%, var(--bg-2) 100%);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  
  .result-box::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(0, 245, 255, 0.1) 0%, transparent 60%);
    pointer-events: none;
  }
  
  .result-box.panic::before {
    background: radial-gradient(circle at 50% 0%, rgba(255, 56, 96, 0.15) 0%, transparent 60%);
    animation: panicGlow 1.5s ease-in-out infinite;
  }
  
  .result-box.done::before {
    background: radial-gradient(circle at 50% 0%, rgba(0, 255, 136, 0.15) 0%, transparent 60%);
  }
  
  .result-emoji {
    font-size: 40px;
    margin-bottom: 8px;
    display: inline-block;
  }
  
  .result-title {
    font-size: 14px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  
  .result-value {
    font-size: 32px;
    font-weight: 900;
    margin-bottom: 4px;
    font-variant-numeric: tabular-nums;
  }
  
  .result-value.cyan { color: var(--neon-cyan); text-shadow: 0 0 20px rgba(0, 245, 255, 0.5); }
  .result-value.pink { color: var(--neon-pink); text-shadow: 0 0 20px rgba(255, 0, 234, 0.5); }
  .result-value.green { color: var(--neon-green); text-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
  .result-value.red { color: var(--neon-red); text-shadow: 0 0 20px rgba(255, 56, 96, 0.5); }
  
  .result-sub {
    font-size: 13px;
    color: var(--text-dim);
  }
  
  /* ===== CHEQUE ===== */
  .cheque {
    margin-top: 20px;
    background: #F5F1E8;
    color: #1A1A1A;
    border-radius: 4px;
    padding: 20px 16px;
    font-family: 'Courier New', 'Menlo', monospace;
    font-size: 12px;
    line-height: 1.5;
    position: relative;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    transform: rotate(-1deg);
  }
  
  .cheque::before, .cheque::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 10px;
    background-image: radial-gradient(circle at 6px 5px, transparent 5px, #F5F1E8 5.5px);
    background-size: 12px 10px;
    background-repeat: repeat-x;
  }
  
  .cheque::before { top: -9px; }
  .cheque::after { bottom: -9px; transform: rotate(180deg); }
  
  .cheque-header {
    text-align: center;
    font-weight: 700;
    margin-bottom: 8px;
    border-bottom: 1px dashed #888;
    padding-bottom: 8px;
  }
  
  .cheque-title {
    font-size: 13px;
    letter-spacing: 1px;
  }
  
  .cheque-sub {
    font-size: 10px;
    color: #666;
    margin-top: 2px;
  }
  
  .cheque-row {
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
  }
  
  .cheque-divider {
    border-top: 1px dashed #888;
    margin: 8px 0;
  }
  
  .cheque-total {
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    padding: 6px 0;
    border-top: 2px solid #1A1A1A;
    border-bottom: 2px solid #1A1A1A;
    margin: 8px 0;
    letter-spacing: 1px;
  }
  
  .cheque-footer {
    text-align: center;
    font-size: 10px;
    color: #666;
    margin-top: 8px;
  }
  
  .cheque-barcode {
    text-align: center;
    font-size: 8px;
    letter-spacing: 2px;
    margin-top: 6px;
    color: #444;
  }
  
  /* ===== BUTTONS ===== */
  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 20px;
  }
  
  .btn {
    padding: 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  
  .btn:active { transform: scale(0.96); }
  
  .btn-primary {
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
    color: var(--bg);
    border: none;
    box-shadow: 0 4px 20px rgba(0, 245, 255, 0.3);
  }
  
  .btn-danger {
    background: rgba(255, 56, 96, 0.1);
    color: var(--neon-red);
    border-color: rgba(255, 56, 96, 0.3);
  }
  
  .btn-full { grid-column: 1 / -1; }
  
  /* ===== ANIMATIONS ===== */
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  @keyframes chipIn {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
  }
  
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  
  @keyframes panicPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  
  @keyframes panicGlow {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  
  .shake { animation: shake 0.4s ease-in-out; }
  
  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 100px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--card);
    border: 1px solid var(--neon-cyan);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
    box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
    pointer-events: none;
    white-space: nowrap;
  }
  
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <h1 class="app-title">ОЦЕНКИ</h1>
    <p class="app-subtitle">вытяни четверть ⚡</p>
  </header>
  
  <div class="subjects-list" id="subjectsList"></div>
  
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">🎯</div>
    <div class="empty-title">Пока пусто</div>
    <div class="empty-text">Добавь свой первый предмет и посчитай, сколько пятёрок нужно до конца четверти</div>
  </div>
  
  <button class="fab" id="addBtn" aria-label="Добавить предмет">+</button>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-handle"></div>
    
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Новый предмет</div>
      <button class="modal-close" id="closeBtn">✕</button>
    </div>
    
    <div class="form-group">
      <label class="form-label">Название предмета</label>
      <input type="text" class="form-input" id="nameInput" placeholder="Например: Алгебра" maxlength="30">
    </div>
    
    <div class="form-group">
      <label class="form-label">Твои оценки</label>
      <div class="grade-buttons">
        <button class="grade-btn" data-grade="2">2</button>
        <button class="grade-btn" data-grade="3">3</button>
        <button class="grade-btn" data-grade="4">4</button>
        <button class="grade-btn" data-grade="5">5</button>
      </div>
      <div class="grades-list" id="gradesList">
        <span class="grades-empty">Нажимай на цифры выше</span>
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label">Какую оценку хочешь?</label>
      <div class="target-selector">
        <button class="target-btn active" data-target="4">Хочу 4</button>
        <button class="target-btn" data-target="5">Хочу 5</button>
      </div>
    </div>
    
    <div class="form-group">
      <div class="result-box" id="resultBox">
        <div class="result-emoji" id="resultEmoji">🤔</div>
        <div class="result-title">Нужно получить</div>
        <div class="result-value cyan" id="resultValue">—</div>
        <div class="result-sub" id="resultSub">Добавь оценки</div>
      </div>
    </div>
    
    <div id="chequeWrap" style="display:none;"></div>
    
    <div class="btn-row">
      <button class="btn btn-danger" id="deleteBtn" style="display:none;">🗑 Удалить</button>
      <button class="btn btn-primary btn-full" id="saveBtn">💾 Сохранить</button>
      <button class="btn" id="shareBtn" style="display:none;">📤 Поделиться</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  
  const STORAGE_KEY = 'grades_app_v1';
  
  // ===== STATE =====
  let state = {
    subjects: [],
    currentId: null
  };
  
  let editing = {
    id: null,
    name: '',
    grades: [],
    target: 4
  };
  
  // ===== STORAGE =====
  const load = () => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state.subjects = JSON.parse(raw);
    } catch (e) { console.error(e); }
  };
  
  const save = () => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.subjects));
    } catch (e) { console.error(e); }
  };
  
  // ===== CALCULATION =====
  const calculate = (grades, target) => {
    if (grades.length === 0) {
      return { needed: 0, average: 0, status: 'empty' };
    }
    
    const sum = grades.reduce((a, b) => a + b, 0);
    const n = grades.length;
    const avg = sum / n;
    const threshold = target === 5 ? 4.5 : 3.5;
    
    if (avg >= threshold) {
      return { needed: 0, average: avg, status: 'done' };
    }
    
    // Сколько пятёрок нужно: (sum + 5k) / (n + k) >= threshold
    // k >= (threshold*n - sum) / (5 - threshold)
    const k = Math.ceil((threshold * n - sum) / (5 - threshold));
    
    return { needed: k, average: avg, status: k > 5 ? 'panic' : 'normal' };
  };
  
  // ===== VIBRATION =====
  const vibrate = (pattern) => {
    if (navigator.vibrate) {
      try { navigator.vibrate(pattern); } catch (e) {}
    }
  };
  
  // ===== TOAST =====
  const toastEl = document.getElementById('toast');
  let toastTimer;
  const showToast = (text) => {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  };
  
  // ===== RENDER LIST =====
  const subjectsListEl = document.getElementById('subjectsList');
  const emptyStateEl = document.getElementById('emptyState');
  
  const renderList = () => {
    if (state.subjects.length === 0) {
      subjectsListEl.style.display = 'none';
      emptyStateEl.style.display = 'flex';
      return;
    }
    
    subjectsListEl.style.display = 'block';
    emptyStateEl.style.display = 'none';
    
    subjectsListEl.innerHTML = state.subjects.map((s, i) => {
      const calc = calculate(s.grades, s.target);
      const avgText = calc.average > 0 ? calc.average.toFixed(2) : '—';
      
      let neededText, neededClass, progressWidth, progressClass, emoji;
      
      if (calc.status === 'empty') {
        neededText = 'нет оценок';
        neededClass = '';
        progressWidth = 0;
        progressClass = '';
      } else if (calc.status === 'done') {
        neededText = 'ВЫТЯНУЛ ✓';
        neededClass = 'done';
        progressWidth = 100;
        progressClass = 'done';
      } else if (calc.status === 'panic') {
        neededText = `${calc.needed} пятёрок 💀`;
        neededClass = 'panic';
        const threshold = s.target === 5 ? 4.5 : 3.5;
        progressWidth = Math.min(95, (calc.average / threshold) * 100);
        progressClass = 'panic';
      } else {
        neededText = `${calc.needed} пят${calc.needed === 1 ? 'ка' : calc.needed < 5 ? 'ёрки' : 'ёрок'}`;
        neededClass = 'needed';
        const threshold = s.target === 5 ? 4.5 : 3.5;
        progressWidth = Math.min(95, (calc.average / threshold) * 100);
        progressClass = '';
      }
      
      return `
        <div class="subject-card" data-id="${s.id}" data-target="${s.target}" style="animation-delay:${i * 0.05}s">
          <div class="subject-card-top">
            <div class="subject-name">${escapeHtml(s.name)}</div>
            <div class="subject-target">цель: ${s.target}</div>
          </div>
          <div class="subject-stats">
            <div class="stat">
              <div class="stat-label">Средний</div>
              <div class="stat-value avg">${avgText}</div>
            </div>
            <div class="stat" style="margin-left:auto; text-align:right;">
              <div class="stat-label">Нужно</div>
              <div class="stat-value ${neededClass}">${neededText}</div>
            </div>
          </div>
          <div class="progress-bar">
            <div class="progress-fill ${progressClass}" style="width:${progressWidth}%"></div>
          </div>
        </div>
      `;
    }).join('');
    
    subjectsListEl.querySelectorAll('.subject-card').forEach(card => {
      card.addEventListener('click', () => openSubject(card.dataset.id));
    });
  };
  
  // ===== MODAL =====
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const nameInput = document.getElementById('nameInput');
  const gradesListEl = document.getElementById('gradesList');
  const resultBox = document.getElementById('resultBox');
  const resultEmoji = document.getElementById('resultEmoji');
  const resultValue = document.getElementById('resultValue');
  const resultSub = document.getElementById('resultSub');
  const chequeWrap = document.getElementById('chequeWrap');
  const deleteBtn = document.getElementById('deleteBtn');
  const shareBtn = document.getElementById('shareBtn');
  const saveBtn = document.getElementById('saveBtn');
  
  const openModal = () => {
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
  };
  
  const closeModal = () => {
    modal.classList.remove('active');
    document.body.style.overflow = '';
  };
  
  const openSubject = (id) => {
    const subj = state.subjects.find(s => s.id === id);
    if (!subj) return;
    editing = {
      id: subj.id,
      name: subj.name,
      grades: [...subj.grades],
      target: subj.target
    };
    renderModal();
    openModal();
  };
  
  const openNew = () => {
    editing = { id: null, name: '', grades: [], target: 4 };
    renderModal();
    openModal();
    setTimeout(() => nameInput.focus(), 350);
  };
  
  const renderModal = () => {
    modalTitle.textContent = editing.id ? 'Редактировать' : 'Новый предмет';
    nameInput.value = editing.name;
    
    // Target buttons
    document.querySelectorAll('.target-btn').forEach(btn => {
      btn.classList.toggle('active', +btn.dataset.target === editing.target);
    });
    
    // Grades list
    if (editing.grades.length === 0) {
      gradesListEl.innerHTML = '<span class="grades-empty">Нажимай на цифры выше</span>';
    } else {
      gradesListEl.innerHTML = editing.grades.map((g, i) => 
        `<div class="grade-chip" data-grade="${g}" data-index="${i}">${g}</div>`
      ).join('');
      gradesListEl.querySelectorAll('.grade-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const idx = +chip.dataset.index;
          editing.grades.splice(idx, 1);
          vibrate(20);
          renderModal();
        });
      });
    }
    
    // Delete button
    deleteBtn.style.display = editing.id ? 'block' : 'none';
    
    updateResult();
  };
  
  const updateResult = () => {
    const calc = calculate(editing.grades, editing.target);
    
    resultBox.classList.remove('panic', 'done');
    
    if (calc.status === 'empty') {
      resultEmoji.textContent = '🤔';
      resultValue.textContent = '—';
      resultValue.className = 'result-value cyan';
      resultSub.textContent = 'Добавь свои оценки';
      chequeWrap.style.display = 'none';
      shareBtn.style.display = 'none';
    } else if (calc.status === 'done') {
      resultEmoji.textContent = '🏆';
      resultValue.textContent = 'ВЫТЯНУЛ!';
      resultValue.className = 'result-value green';
      resultSub.textContent = `Средний: ${calc.average.toFixed(2)} · Красавчик`;
      resultBox.classList.add('done');
      renderCheque();
      vibrate([30, 50, 30]);
    } else if (calc.status === 'panic') {
      resultEmoji.textContent = '💀';
      resultValue.textContent = `${calc.needed} пятёрок`;
      resultValue.className = 'result-value red';
      resultSub.textContent = `Средний: ${calc.average.toFixed(2)} · Будет сложно...`;
      resultBox.classList.add('panic');
      resultBox.classList.add('shake');
      setTimeout(() => resultBox.classList.remove('shake'), 400);
      vibrate([100, 50, 100, 50, 100]);
      renderCheque();
    } else {
      const word = calc.needed === 1 ? 'пятёрка' : calc.needed < 5 ? 'пятёрки' : 'пятёрок';
      resultEmoji.textContent = calc.needed <= 2 ? '😎' : '🔥';
      resultValue.textContent = `${calc.needed} ${word}`;
      resultValue.className = editing.target === 5 ? 'result-value pink' : 'result-value cyan';
      resultSub.textContent = `Средний: ${calc.average.toFixed(2)} · Реально!`;
      renderCheque();
    }
    
    if (editing.grades.length > 0) {
      shareBtn.style.display = 'flex';
    }
  };
  
  // ===== CHEQUE =====
  const renderCheque = () => {
    const calc = calculate(editing.grades, editing.target);
    if (editing.grades.length === 0) {
      chequeWrap.style.display = 'none';
      return;
    }
    
    const name = editing.name || 'Предмет';
    const avg = calc.average.toFixed(2);
    const count = editing.grades.length;
    const sum = editing.grades.reduce((a, b) => a + b, 0);
    
    const counts = { 2: 0, 3: 0, 4: 0, 5: 0 };
    editing.grades.forEach(g => counts[g]++);
    
    let statusLine, totalLine;
    if (calc.status === 'done') {
      statusLine = 'СТАТУС: ВЫТЯНУЛ ✓';
      totalLine = `ИТОГО: ${editing.target} В КАРМАНе 🏆`;
    } else if (calc.status === 'panic') {
      statusLine = 'СТАТУС: ПИПЕЦ 💀';
      totalLine = `ИТОГО: ${calc.needed} ПЯТЁРОК НУЖНО`;
    } else {
      statusLine = 'СТАТУС: МОЖНО ВЫТАЩИТЬ';
      totalLine = `ИТОГО: ${calc.needed} ПЯТ${calc.needed === 1 ? 'РКА' : 'ЁРОК'} НУЖНО`;
    }
    
    const date = new Date();
    const dateStr = date.toLocaleDateString('ru-RU') + ' ' + date.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    const barcode = Array.from({length: 20}, () => Math.floor(Math.random() * 10)).join('');
    
    chequeWrap.innerHTML = `
      <div class="cheque">
        <div class="cheque-header">
          <div class="cheque-title">★ АПТЕКА «ВЫЖИВАНИЕ» ★</div>
          <div class="cheque-sub">кассир: твоя нервная система</div>
        </div>
        <div class="cheque-row"><span>${name.toUpperCase()}</span><span>${dateStr}</span></div>
        <div class="cheque-divider"></div>
        ${counts[5] ? `<div class="cheque-row"><span>5 x ${counts[5]}</span><span>+${counts[5]*5}</span></div>` : ''}
        ${counts[4] ? `<div class="cheque-row"><span>4 x ${counts[4]}</span><span>+${counts[4]*4}</span></div>` : ''}
        ${counts[3] ? `<div class="cheque-row"><span>3 x ${counts[3]}</span><span>+${counts[3]*3}</span></div>` : ''}
        ${counts[2] ? `<div class="cheque-row"><span>2 x ${counts[2]}</span><span>+${counts[2]*2}</span></div>` : ''}
        <div class="cheque-divider"></div>
        <div class="cheque-row"><span>позиций:</span><span>${count}</span></div>
        <div class="cheque-row"><span>сумма баллов:</span><span>${sum}</span></div>
        <div class="cheque-row"><span>средний:</span><span>${avg}</span></div>
        <div class="cheque-row"><span>цель:</span><span>${editing.target}</span></div>
        <div class="cheque-divider"></div>
        <div class="cheque-row"><span>${statusLine}</span><span></span></div>
        <div class="cheque-total">${totalLine}</div>
        <div class="cheque-footer">спасибо, что выбрали нас<br>возврату нервы не подлежат</div>
        <div class="cheque-barcode">||||| ${barcode} |||||</div>
      </div>
    `;
    chequeWrap.style.display = 'block';
  };
  
  // ===== SAVE / DELETE / SHARE =====
  const saveSubject = () => {
    const name = nameInput.value.trim();
    if (!name) {
      nameInput.focus();
      nameInput.classList.add('shake');
      setTimeout(() => nameInput.classList.remove('shake'), 400);
      showToast('Введи название предмета');
      return;
    }
    if (editing.grades.length === 0) {
      showToast('Добавь хотя бы одну оценку');
      return;
    }
    
    if (editing.id) {
      const idx = state.subjects.findIndex(s => s.id === editing.id);
      if (idx !== -1) {
        state.subjects[idx] = {
          ...state.subjects[idx],
          name,
          grades: [...editing.grades],
          target: editing.target
        };
      }
    } else {
      state.subjects.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        name,
        grades: [...editing.grades],
        target: editing.target
      });
    }
    
    save();
    renderList();
    closeModal();
    vibrate(30);
    showToast('Сохранено ✓');
  };
  
  const deleteSubject = () => {
    if (!editing.id) return;
    if (!confirm('Удалить предмет?')) return;
    state.subjects = state.subjects.filter(s => s.id !== editing.id);
    save();
    renderList();
    closeModal();
    vibrate([50, 30, 50]);
    showToast('Удалено');
  };
  
  const shareSubject = () => {
    const calc = calculate(editing.grades, editing.target);
    const name = editing.name || 'Предмет';
    const avg = calc.average.toFixed(2);
    
    let text;
    if (calc.status === 'done') {
      text = `🏆 ${name}: ВЫТЯНУЛ ${editing.target}! Средний: ${avg}`;
    } else if (calc.status === 'panic') {
      text = `💀 ${name}: нужно ${calc.needed} пятёрок до ${editing.target}... Средний: ${avg}`;
    } else {
      text = `🔥 ${name}: нужно ${calc.needed} пят${calc.needed === 1 ? 'ка' : 'ёрок'} до ${editing.target}. Средний: ${avg}`;
    }
    text += '\n\n— посчитано в «ОЦЕНКИ»';
    
    if (navigator.share) {
      navigator.share({ title: name, text }).catch(() => {});
    } else {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Скопировано в буфер');
      }).catch(() => {
        showToast('Не удалось поделиться');
      });
    }
    vibrate(20);
  };
  
  // ===== UTILS =====
  const escapeHtml = (s) => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  
  // ===== EVENTS =====
  document.getElementById('addBtn').addEventListener('click', () => {
    vibrate(20);
    openNew();
  });
  
  document.getElementById('closeBtn').addEventListener('click', closeModal);
  
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });
  
  nameInput.addEventListener('input', () => {
    editing.name = nameInput.value;
  });
  
  document.querySelectorAll('.grade-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const grade = +btn.dataset.grade;
      editing.grades.push(grade);
      vibrate(grade === 5 ? 30 : grade === 2 ? [40, 20, 40] : 20);
      renderModal();
    });
  });
  
  document.querySelectorAll('.target-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      editing.target = +btn.dataset.target;
      vibrate(20);
      renderModal();
    });
  });
  
  saveBtn.addEventListener('click', saveSubject);
  deleteBtn.addEventListener('click', deleteSubject);
  shareBtn.addEventListener('click', shareSubject);
  
  // Keyboard: Enter to save
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      saveSubject();
    }
  });
  
  // ===== INIT =====
  load();
  renderList();
})();
</script>

</body>
</html>
